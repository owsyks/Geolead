services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geolead_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/geolead_ai?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      OUTBOUND_BASE_URL: http://localhost:5000
      OUTBOUND_ADMIN_EMAIL: admin@geoleadai.local
      OUTBOUND_PHYSICAL_ADDRESS: GeoLead AI, 123 Market St, Austin, TX 78701
      OUTBOUND_SECRET_KEY: geolead-local-dev-key
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"

  worker:
    build:
      context: ./backend
    command: node dist/workers/worker.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/geolead_ai?schema=public
      REDIS_URL: redis://redis:6379
      OUTBOUND_BASE_URL: http://localhost:5000
      OUTBOUND_ADMIN_EMAIL: admin@geoleadai.local
      OUTBOUND_PHYSICAL_ADDRESS: GeoLead AI, 123 Market St, Austin, TX 78701
      OUTBOUND_SECRET_KEY: geolead-local-dev-key
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_OUTBOUND_API_BASE: http://localhost:5000
    environment:
      NEXT_PUBLIC_OUTBOUND_API_BASE: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
