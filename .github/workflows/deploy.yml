name: Deploy to Heroku

on:
  push:
    branches:
      - feat/auth-multi-tenancy
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: geolead-ai-api
          heroku_email: elmountaknat@gmail.com
          appdir: backend
          buildpack: heroku/nodejs
          delay: 5
        env:
          HD_BACKEND: backend
