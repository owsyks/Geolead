name: Deploy to VPS

on:
  push:
    branches:
      - feat/auth-multi-tenancy
      - main
  workflow_dispatch:
    inputs:
      paymento_smoke_test:
        description: Create one unpaid Paymento request to verify merchant checkout readiness
        required: false
        type: boolean
        default: false

# The feature and production branches can be updated seconds apart. Both deploy
# to the same Compose project, so VPS mutations must never run concurrently.
concurrency:
  group: geolead-vps-production
  cancel-in-progress: false

# Deploys by SSHing into the VPS, pulling the latest code, and rebuilding the
# Docker Compose stack. The backend container runs `prisma migrate deploy` on
# boot, so migrations apply automatically. Requires repo secrets:
#   SSH_HOST  - server IP or hostname
#   SSH_USER  - deploy user (must be able to run docker)
#   SSH_KEY   - private key authorized for SSH_USER
#   SSH_PORT  - (optional) SSH port, defaults to 22
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PAYMENTO_API_KEY: ${{ secrets.PAYMENTO_API_KEY }}
          PAYMENTO_IPN_SECRET: ${{ secrets.PAYMENTO_IPN_SECRET }}
          PAYMENTO_SMOKE_TEST: ${{ inputs.paymento_smoke_test || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GITHUB_REF_NAME,RESEND_API_KEY,RESEND_FROM_EMAIL,PAYMENTO_API_KEY,PAYMENTO_IPN_SECRET,PAYMENTO_SMOKE_TEST
          script: |
            set -e
            cd /opt/geolead
            echo "Recent sanitized Paymento errors from the previous backend container:"
            docker compose -f docker-compose.prod.yml logs --tail=200 backend 2>&1 | grep -E 'Paymento checkout creation failed|Paymento IPN processing failed' || true
            git fetch --all
            git reset --hard "origin/${GITHUB_REF_NAME:-feat/auth-multi-tenancy}"
            if ! grep -Eq '^SECRET_ENCRYPTION_KEY=.{32,}$' .env; then
              printf '\nSECRET_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
              chmod 600 .env
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend node dist/scripts/auditTenantIsolation.js
            docker compose -f docker-compose.prod.yml exec -T backend node dist/scripts/auditAuthBillingReadiness.js
            docker compose -f docker-compose.prod.yml exec -T backend node dist/scripts/configurePaymento.js
            if [ "$PAYMENTO_SMOKE_TEST" = "true" ]; then
              docker compose -f docker-compose.prod.yml exec -T backend node dist/scripts/smokePaymentoCheckout.js
            fi
            docker image prune -f
