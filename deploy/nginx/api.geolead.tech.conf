# Install to /etc/nginx/sites-available/api.geolead.tech and symlink into
# sites-enabled, then run: certbot --nginx -d api.geolead.tech
# certbot rewrites this to add the listen 443 ssl + certificate lines and an
# HTTP->HTTPS redirect, keeping the location/proxy blocks below.
server {
    listen 80;
    server_name api.geolead.tech;

    # Proxy everything to the backend container (loopback-bound on the host).
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (/ws/outbound rides the same port as the API).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Acquisition scans and long polls can take minutes — don't cut them off.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    client_max_body_size 25m;
}
